# The Windows package a tester gets: an NSIS installer and a portable zip
# around the pinned llama.cpp Vulkan engine (docs/DECISIONS.md, 2026-09-18).
# Built here and not on a laptop so that what ten people install is what a
# commit produced, and installed here because this is a Windows machine that
# has never seen the build: the installer runs silently, the installed app is
# started and asked for its health, a second launch is checked to give way to
# the first, and the uninstaller is checked to leave the person's data alone.
#
# What a hosted runner cannot say: whether SmartScreen or Smart App Control
# lets an unsigned build through, how the engine behaves on a real GPU, and
# what a person sees. Those are the dry run's, on a real machine.
#
# Started by hand, for a check or for a release being prepared, and by a
# version tag; never on a timer or per push (docs/DECISIONS.md, 2026-09-24).
# A Windows runner costs double minutes, this is the most expensive job there
# is, and nothing here changes what `ci` decides about a commit. The daily
# run that kept its cache warm until the laptop test is gone, so a first run
# after a week without one starts cold (81 minutes on 2026-09-18).

name: package

on:
  workflow_dispatch:
    inputs:
      sign:
        description: "none: the unsigned test build. rehearsal: sign everything with a throwaway certificate made on the runner, to prove the path a real certificate will take."
        type: choice
        options: [none, rehearsal]
        default: none
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  windows:
    name: the Windows installer and the portable zip, installed and started
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-wasip2
          echo "LOCALSPACE_BUILD_ID=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            harnesses/whiteboard-logic -> target
            harnesses/planner-logic -> target
          cache-on-failure: true
      - name: the web client and the command line
        shell: bash
        run: |
          (cd web && npm ci && npm run build)
          cargo build --release -p localspace-cli
      - name: tauri-cli, pinned
        shell: bash
        run: cargo install tauri-cli --version 2.11.4 --locked
      # A real certificate is not here yet (docs/DECISIONS.md, 2026-09-18). What
      # it will do is rehearsed with one made on this runner and thrown away
      # with it: every program file signed, the installer and the uninstaller
      # too, and checked below. A real one sets LOCALSPACE_SIGN_COMMAND the
      # same way, from a secret, and nothing else changes.
      - name: a throwaway certificate, to rehearse signing
        if: ${{ inputs.sign == 'rehearsal' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=localSpace signing rehearsal, not a publisher' -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddDays(2)
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "no signtool on this runner" }
          $command = @{ cmd = $signtool.FullName; args = @('sign', '/fd', 'SHA256', '/sha1', $cert.Thumbprint, '%1') } | ConvertTo-Json -Compress
          "LOCALSPACE_SIGN_COMMAND=$command" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SIGNED_BY=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: the installer and the portable zip, around the engine verified against its pin
        shell: bash
        run: node scripts/package.mjs
      - name: install it silently and check what landed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem dist/windows/*-setup.exe | Select-Object -First 1
          $installer = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "the installer exited with $($installer.ExitCode)" }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\localSpace'
          Get-ChildItem $dir | Format-Table Name, Length
          $expected = 'localspace-app.exe', 'localspace.exe', 'uninstall.exe', 'README.txt', 'web\index.html',
            'engine\llama-server.exe', 'engine\ggml-vulkan.dll', 'licences\llama.cpp.txt', 'registry'
          foreach ($item in $expected) {
            if (-not (Test-Path (Join-Path $dir $item))) { throw "not installed: $item" }
          }
          "INSTALL_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: every program file that was installed is signed, and the installer too
        if: ${{ env.SIGNED_BY != '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Smart App Control judges every executable and library a program
          # loads, so one unsigned file among them is a refused app.
          $files = @(Get-ChildItem dist/windows/*-setup.exe) + @(Get-ChildItem $env:INSTALL_DIR -Recurse -Include *.exe, *.dll)
          $unsigned = @()
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            $by = if ($signature.SignerCertificate) { $signature.SignerCertificate.Thumbprint } else { 'nobody' }
            "{0,-60} {1}" -f $file.Name, $by
            if ($by -ne $env:SIGNED_BY) { $unsigned += $file.FullName }
          }
          if ($unsigned.Count) { throw "not signed by the certificate of this run: $($unsigned -join ', ')" }
          "$($files.Count) program files, every one signed by $env:SIGNED_BY"
      - name: the installed engine and command line run from where they were put
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:INSTALL_DIR\engine\llama-server.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "the engine does not run from the installed folder" }
          # No GPU and no Vulkan loader on this runner: the list is empty, and
          # that it is printed at all is the CPU fallback's first step.
          & "$env:INSTALL_DIR\engine\llama-server.exe" --list-devices
          if ($LASTEXITCODE -ne 0) { throw "the engine cannot list its devices without a GPU" }
          & "$env:INSTALL_DIR\localspace.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "the command line does not run from the installed folder" }
          $doctor = & "$env:INSTALL_DIR\localspace.exe" doctor 2>&1 | Out-String
          $doctor
          # The release build is the one a person installs, and it once
          # optimised the memory measurement away: 1,344,816 GB/s, and a first
          # run that estimated 2,407,216 tokens a second. No debug build ever
          # showed it, so the figure is read here, from the installed binary.
          if ($doctor -notmatch 'moves at ([0-9.]+) GB/s') { throw "doctor does not say how fast the memory moves" }
          $moves = [double]$Matches[1]
          if ($moves -lt 1 -or $moves -gt 100) { throw "the memory of this runner does not move at $moves GB/s" }
          # A figure that cannot be believed is replaced by a careful one, and
          # Core says so: that must not pass for a measurement here.
          if ($doctor -match 'which no memory does') { throw "the release build did not measure the memory" }
      - name: the installed app starts, serves its client, and a second launch gives way
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # No flags: the folder a tester's first start makes for itself.
          $data = Join-Path $env:LOCALAPPDATA 'localSpace'
          if (Test-Path $data) { throw "$data exists before the first start" }
          $log = Join-Path $data 'logs\app.log'
          $exe = Join-Path $env:INSTALL_DIR 'localspace-app.exe'
          $app = Start-Process -FilePath $exe -PassThru
          $url = $null
          $window = $false
          foreach ($second in 1..90) {
            Start-Sleep -Seconds 1
            if (Test-Path $log) {
              $line = Select-String -Path $log -Pattern 'web client at (http://[0-9.:]+/)' | Select-Object -First 1
              if ($line) { $url = $line.Matches[0].Groups[1].Value }
              $window = [bool](Select-String -Path $log -Pattern 'the window is open' -Quiet)
            }
            if (($url -and $window) -or $app.HasExited) { break }
          }
          # The window asks what this computer is; the look takes a few seconds.
          foreach ($second in 1..30) {
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern 'the computer as found' -Quiet)) { break }
            Start-Sleep -Seconds 1
          }
          if (Test-Path $log) { Get-Content $log }
          # The same figure, as the app itself found it, and what it led to.
          if (Select-String -Path $log -Pattern 'which no memory does' -Quiet) { throw "the installed app did not measure the memory" }
          $found = Select-String -Path $log -Pattern 'copied at ([0-9.]+) GB/s' | Select-Object -First 1
          if ($found) {
            $copied = [double]$found.Matches[0].Groups[1].Value
            if ($copied -lt 1 -or $copied -gt 100) { throw "the app measured this runner's memory at $copied GB/s" }
          }
          $estimate = Select-String -Path $log -Pattern 'estimated at ([0-9.]+) tokens a second' | Select-Object -First 1
          if ($estimate -and [double]$estimate.Matches[0].Groups[1].Value -gt 1000) { throw "the first run estimated $($estimate.Matches[0].Groups[1].Value) tokens a second" }
          if (-not $url) { throw "the installed app did not start its server" }
          if (-not $window) { throw "the installed app did not open its window" }
          $health = Invoke-WebRequest "${url}healthz" -UseBasicParsing
          if ($health.StatusCode -ne 200) { throw "healthz answered $($health.StatusCode)" }
          $index = Invoke-WebRequest $url -UseBasicParsing
          if ($index.Content -notmatch '<div id="root">') { throw "the installed web client was not served" }
          $again = Start-Process -FilePath $exe -PassThru
          if (-not $again.WaitForExit(30000)) { throw "a second launch kept running beside the first" }
          if ($app.HasExited) { throw "the first copy went away when a second was launched" }
          Stop-Process -Id $app.Id
      - name: the portable copy has the same files and its engine runs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Get-ChildItem dist/windows/*-portable.zip | Select-Object -First 1
          $to = Join-Path $env:RUNNER_TEMP 'portable'
          Expand-Archive -Path $zip.FullName -DestinationPath $to
          foreach ($item in 'localspace-app.exe', 'localspace.exe', 'README.txt', 'web\index.html', 'engine\llama-server.exe', 'registry') {
            if (-not (Test-Path (Join-Path $to "localSpace\$item"))) { throw "not in the zip: $item" }
          }
          & "$to\localSpace\engine\llama-server.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "the portable engine does not run" }
      - name: uninstalling removes the program and leaves the data
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Process -FilePath (Join-Path $env:INSTALL_DIR 'uninstall.exe') -ArgumentList '/S' -Wait
          foreach ($second in 1..60) {
            if (-not (Test-Path (Join-Path $env:INSTALL_DIR 'localspace-app.exe'))) { break }
            Start-Sleep -Seconds 1
          }
          if (Test-Path (Join-Path $env:INSTALL_DIR 'localspace-app.exe')) { throw "the uninstaller left the program behind" }
          # "Delete the application data" was not asked for, so it stays.
          if (-not (Test-Path (Join-Path $env:LOCALAPPDATA 'localSpace\db'))) { throw "the data went with the program" }
      # Kept one day, for downloading to the build machine: the repository is
      # public, and anything public goes out only as a GitHub Release when the
      # founder decides (docs/DECISIONS.md, 2026-09-25).
      - uses: actions/upload-artifact@v4
        with:
          name: localSpace-windows-${{ env.LOCALSPACE_BUILD_ID }}
          path: dist/windows/
          retention-days: 1
          if-no-files-found: error
