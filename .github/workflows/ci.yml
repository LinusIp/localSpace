# Every commit compiles, passes its tests and the linters, and the gates
# that can be measured on a runner are checks that fail on regression
# (CLAUDE.md, "How you work"; docs/DECISIONS.md, answer 6 to the step-5
# report). The toolchains come from rustup and setup-node on the runner;
# the actions are GitHub's own plus Swatinem/rust-cache, pinned to a commit
# (docs/DECISIONS.md, 2026-09-13). Nothing here downloads a browser or a
# model: the end-to-end walk drives the Chrome already on the runner and
# runs without an agent.
#
# Cheap before expensive: `check` (formatting, lint, types) gates every job
# that builds Rust, and every job has a timeout, so a broken commit costs
# minutes rather than an hour.
#
# What runs when (docs/DECISIONS.md, 2026-10-15), so that a private
# repository stays inside the free plan's minutes: formatting, lint, types,
# the Rust tests and the web checks on every push and pull request; the
# end-to-end walk and the measurement kit on pull requests, on merges to
# main and when run by hand. The Windows package (`package.yml`) runs only
# by hand, before a merge to main, and for a release tag.
# Nothing reaches a tester until this is green on that exact commit and
# the release check has passed. `scripts/check.sh` runs the same jobs on a
# Linux machine, kept for later; no push waits on it.
#
# Runners are pinned labels, never a moving alias. Core and the server always
# build and test on Linux, which is what organisations deploy. The Tauri
# shell builds there too, with the packages below (run 12 of this workflow
# type-checked the whole workspace on Linux); if that ever stops, the rust
# job splits into Core and the server on Linux and the desktop shell on
# Windows (docs/DECISIONS.md, 2026-09-11).

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      w32_gate:
        description: "Check the W32 canvas measurement recorded in docs/gates/w32-canvas.json"
        type: boolean
        default: false

permissions:
  contents: read

# A push supersedes the run of the push before it on the same branch: the
# older run is cancelled rather than finished for nothing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # Full debug info filled the runner's disk: runs 2 to 12, 14 and 15 died
  # of "No space left on device" while building the tests (a full-debug
  # target of this workspace measures 59 GB on the build machine, 13 GB of
  # it debug info). Line tables keep `panicked at file:line` and backtraces
  # readable.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  check:
    name: check (format, lint, types)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Every catalog file still at its address, with the size and SHA-256
      # its entry records: one request per file, nothing downloaded
      # (docs/DECISIONS.md, 2026-10-11).
      - name: the catalog's download addresses
        run: node scripts/check-catalog-files.mjs
      - name: one version, in Cargo.toml and in the shell's tauri.conf.json
        run: node scripts/check-version.mjs
      - name: rustfmt, the workspace and the harness crates
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          cargo fmt --all -- --check
          for crate in harnesses/*-logic; do (cd "$crate" && cargo fmt -- --check); done
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - name: types, the app and its build config
        run: npm run typecheck
        working-directory: web
      - name: types, the canvas package
        run: npm run typecheck:packages
        working-directory: web
      - name: types, the whiteboard surface
        run: npm run typecheck:whiteboard
        working-directory: web
      - name: every shipped dependency has its licence text (third-party notices)
        run: node scripts/third-party-notices.mjs --check

  web:
    name: web (tests, build, sizes, frame times)
    needs: check
    timeout-minutes: 30
    strategy:
      matrix:
        # The frame-time baseline names this label; change both together.
        runner: [ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:whiteboard
      - name: bundle sizes against their limits
        run: node scripts/check-sizes.mjs
      - name: canvas frame times against the CI baseline
        run: |
          # A shared runner is noisy and the performance gate is the W32
          # number, so this fails only at about double the baseline.
          if [ -f packages/canvas/bench/baseline.ci.json ]; then
            node e2e/bench-canvas.mjs --profile ci --runner "${{ matrix.runner }}" --tolerance 1.0
          else
            node e2e/bench-canvas.mjs --profile ci --runner "${{ matrix.runner }}" --record
            echo "::warning::No CI frame-time baseline is committed yet. This run recorded one (artifact bench-baseline-ci); commit it as web/packages/canvas/bench/baseline.ci.json to turn the regression check on."
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-baseline-ci
          path: web/packages/canvas/bench/baseline.ci.json
          if-no-files-found: ignore

  rust:
    name: rust (clippy, tests) on Linux
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: room on the runner's disk
        # The image ships toolchains this build never touches: about 20 GB
        # of Android, .NET, Haskell, CodeQL and Docker images, and the debug
        # build of the tests needs the room.
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null
          df -h / | tail -1
      - name: toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustup target add wasm32-wasip2
      - name: system libraries the Tauri shell links against
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            harnesses/whiteboard-logic -> target
            harnesses/planner-logic -> target
          cache-on-failure: true
      - name: the web bundle the shell embeds, and the harness packages the tests load
        run: |
          (cd web && npm ci && npm run build)
          node scripts/hpack.mjs --in-place
      - name: clippy, with unwrap_used a warning and everything else an error
        run: cargo clippy --workspace --all-targets -- -D warnings --force-warn clippy::unwrap_used
      - name: tests
        run: cargo test --workspace
      # The client's types are generated from `proto` by the tests above,
      # never written by hand (architecture v2 §5): the committed ones must
      # be the generator's output, and the generator's output is kept as an
      # artifact for whoever changes `proto` without a build of their own
      # (docs/DECISIONS.md, 2026-10-08).
      - name: the client's types match the generator's output
        run: git diff --exit-code --stat -- web/src/api/generated
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-types
          path: web/src/api/generated
      - name: the disk after the build
        if: always()
        run: |
          df -h / | tail -1
          du -sh target harnesses/*/target 2>/dev/null || true

  e2e:
    name: the step-5 gate and Phase A's gate, end to end in a browser
    # Not on every push (docs/DECISIONS.md, 2026-10-15): on pull requests,
    # on merges to main and when run by hand.
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    needs: [web, rust]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-wasip2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            harnesses/whiteboard-logic -> target
            harnesses/planner-logic -> target
          cache-on-failure: true
      - name: build the shell, the harness packages and the server
        run: |
          (cd web && npm ci && npm run build)
          node scripts/hpack.mjs --in-place
          cargo build --release -p localspace-cli -p localspace-core --bin localspace --bin fake_llama_server
      - name: serve, then install the whiteboard from the catalog and walk the gate
        run: |
          cat > "$RUNNER_TEMP/localspace.toml" <<EOF
          [server]
          bind = "127.0.0.1:8443"
          [storage]
          root = "$RUNNER_TEMP/data"
          [harnesses]
          catalogs = ["harnesses", "registry"]
          # The tool machinery is walked with the whiteboard, which 0.2 sets aside.
          set_aside = []
          EOF
          ./target/release/localspace serve --config "$RUNNER_TEMP/localspace.toml" \
            --personal --token ci-token --allow-below-floor \
            > "$RUNNER_TEMP/serve.log" 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8443/healthz > /dev/null && break; sleep 1; done
          cd web && node e2e/whiteboard.mjs http://127.0.0.1:8443 ci-token --no-agent
      - name: maths in a chat answer, rendered by KaTeX (the test engine writes a formula); a text file sent to a model that cannot read pictures; the message box keeps the cursor; the looks behind the themes switch, with screenshots
        run: |
          mkdir -p "$RUNNER_TEMP/mathsdata/models" "$RUNNER_TEMP/mathscatalog"
          printf 'writes maths\n' > "$RUNNER_TEMP/mathsdata/models/maths.gguf"
          bytes="$(wc -c < "$RUNNER_TEMP/mathsdata/models/maths.gguf" | tr -d ' ')"
          cat > "$RUNNER_TEMP/mathscatalog/catalog.json" <<EOF
          {"version": 1, "models": [
            {"id": "maths", "title": "The test engine that writes maths", "params_b": 0.1, "bytes": $bytes, "context_len": 8192,
             "repo": "example/maths", "files": ["maths.gguf"],
             "tensor": {"core_bytes": 16, "routed_expert_bytes": 0, "layers": 2, "moe": null, "kv_bytes_per_token_fp16": 256}}
          ]}
          EOF
          cat > "$RUNNER_TEMP/maths.toml" <<EOF
          [server]
          bind = "127.0.0.1:8447"
          [storage]
          root = "$RUNNER_TEMP/mathsdata"
          [models]
          dir = "$RUNNER_TEMP/mathscatalog"
          EOF
          LOCALSPACE_LLAMA_SERVER="$PWD/target/release/fake_llama_server" ./target/release/localspace serve \
            --config "$RUNNER_TEMP/maths.toml" --personal --token ci-token --allow-below-floor \
            > "$RUNNER_TEMP/maths-serve.log" 2>&1 &
          MATHS=$!
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8447/healthz > /dev/null && break; sleep 1; done
          (cd web && node e2e/maths.mjs http://127.0.0.1:8447 ci-token maths) || { echo "--- the server's log"; tail -n 60 "$RUNNER_TEMP/maths-serve.log"; exit 1; }
          (cd web && node e2e/text-files.mjs http://127.0.0.1:8447 ci-token maths "$RUNNER_TEMP/mathsdata") || { echo "--- the server's log"; tail -n 60 "$RUNNER_TEMP/maths-serve.log"; exit 1; }
          (cd web && node e2e/cursor.mjs http://127.0.0.1:8447 ci-token maths) || { echo "--- the server's log"; tail -n 60 "$RUNNER_TEMP/maths-serve.log"; exit 1; }
          (cd web && node e2e/looks.mjs http://127.0.0.1:8447 ci-token maths "$RUNNER_TEMP/looks") || { echo "--- the server's log"; tail -n 60 "$RUNNER_TEMP/maths-serve.log"; exit 1; }
          kill "$MATHS"; wait "$MATHS" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: looks-screenshots
          path: ${{ runner.temp }}/looks
          if-no-files-found: ignore
      - name: a picture attached in the composer, sent, shown, and deleted with its chat
        run: |
          mkdir -p "$RUNNER_TEMP/picturesdata/models" "$RUNNER_TEMP/picturescatalog"
          printf 'sees pictures\n' > "$RUNNER_TEMP/picturesdata/models/seer.gguf"
          printf 'not a real projector\n' > "$RUNNER_TEMP/picturesdata/models/seer-mmproj.gguf"
          seer="$(wc -c < "$RUNNER_TEMP/picturesdata/models/seer.gguf" | tr -d ' ')"
          proj="$(wc -c < "$RUNNER_TEMP/picturesdata/models/seer-mmproj.gguf" | tr -d ' ')"
          cat > "$RUNNER_TEMP/picturescatalog/catalog.json" <<EOF
          {"version": 1, "models": [
            {"id": "seer", "title": "The test engine that sees", "params_b": 0.1, "bytes": $((seer + proj)), "context_len": 8192,
             "repo": "example/seer", "files": ["seer.gguf", "seer-mmproj.gguf"], "vision_file": "seer-mmproj.gguf",
             "tensor": {"core_bytes": 16, "routed_expert_bytes": 0, "layers": 2, "moe": null, "kv_bytes_per_token_fp16": 256}}
          ]}
          EOF
          cat > "$RUNNER_TEMP/pictures.toml" <<EOF
          [server]
          bind = "127.0.0.1:8448"
          [storage]
          root = "$RUNNER_TEMP/picturesdata"
          [models]
          dir = "$RUNNER_TEMP/picturescatalog"
          EOF
          LOCALSPACE_LLAMA_SERVER="$PWD/target/release/fake_llama_server" ./target/release/localspace serve \
            --config "$RUNNER_TEMP/pictures.toml" --personal --token ci-token --allow-below-floor \
            > "$RUNNER_TEMP/pictures-serve.log" 2>&1 &
          PICTURES=$!
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8448/healthz > /dev/null && break; sleep 1; done
          (cd web && node e2e/pictures.mjs http://127.0.0.1:8448 ci-token seer "$RUNNER_TEMP/picturesdata" "$PWD/../crates/localspace-cli/assets/measure-picture.png") || { echo "--- the server's log"; tail -n 60 "$RUNNER_TEMP/pictures-serve.log"; exit 1; }
          kill "$PICTURES"; wait "$PICTURES" || true
      - name: an answer that ends early is said in the person's language (a full chat, a refusal for want of room, the answer's own limit)
        run: |
          mkdir -p "$RUNNER_TEMP/fulldata/models" "$RUNNER_TEMP/fullcatalog"
          printf 'fills the context over 2000 bytes; refuses requests over 6000 bytes\n' > "$RUNNER_TEMP/fulldata/models/full.gguf"
          printf 'stops at the limit\n' > "$RUNNER_TEMP/fulldata/models/limit.gguf"
          full="$(wc -c < "$RUNNER_TEMP/fulldata/models/full.gguf" | tr -d ' ')"
          limit="$(wc -c < "$RUNNER_TEMP/fulldata/models/limit.gguf" | tr -d ' ')"
          cat > "$RUNNER_TEMP/fullcatalog/catalog.json" <<EOF
          {"version": 1, "models": [
            {"id": "full", "title": "The test engine whose context runs out", "params_b": 0.1, "bytes": $full, "context_len": 8192,
             "repo": "example/full", "files": ["full.gguf"],
             "tensor": {"core_bytes": 16, "routed_expert_bytes": 0, "layers": 2, "moe": null, "kv_bytes_per_token_fp16": 256}},
            {"id": "limit", "title": "The test engine that writes to its limit", "params_b": 0.1, "bytes": $limit, "context_len": 8192,
             "repo": "example/limit", "files": ["limit.gguf"],
             "tensor": {"core_bytes": 16, "routed_expert_bytes": 0, "layers": 2, "moe": null, "kv_bytes_per_token_fp16": 256}}
          ]}
          EOF
          cat > "$RUNNER_TEMP/full.toml" <<EOF
          [server]
          bind = "127.0.0.1:8449"
          [storage]
          root = "$RUNNER_TEMP/fulldata"
          [models]
          dir = "$RUNNER_TEMP/fullcatalog"
          EOF
          LOCALSPACE_LLAMA_SERVER="$PWD/target/release/fake_llama_server" ./target/release/localspace serve \
            --config "$RUNNER_TEMP/full.toml" --personal --token ci-token --allow-below-floor \
            > "$RUNNER_TEMP/full-serve.log" 2>&1 &
          FULL=$!
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8449/healthz > /dev/null && break; sleep 1; done
          (cd web && node e2e/chat-full.mjs http://127.0.0.1:8449 ci-token) || { echo "--- the server's log"; tail -n 60 "$RUNNER_TEMP/full-serve.log"; exit 1; }
          kill "$FULL"; wait "$FULL" || true
      - name: an organisation server; two people in two browsers; a viewer refused; the audit log verified; the server's screens in every look, with screenshots
        run: |
          cat > "$RUNNER_TEMP/org.toml" <<EOF
          [organisation]
          name = "Example Bank"
          [server]
          bind = "127.0.0.1:8446"
          public_url = "http://127.0.0.1:8446"
          [storage]
          root = "$RUNNER_TEMP/orgdata"
          [harnesses]
          catalogs = ["harnesses", "registry"]
          # The tool machinery is walked with the whiteboard, which 0.2 sets aside.
          set_aside = []
          EOF
          ./target/release/localspace serve --config "$RUNNER_TEMP/org.toml" --allow-below-floor --insecure \
            > "$RUNNER_TEMP/org-serve.log" 2>&1 &
          ORG=$!
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8446/healthz > /dev/null && break; sleep 1; done
          (cd web && node e2e/org.mjs http://127.0.0.1:8446 --data "$RUNNER_TEMP/orgdata")
          (cd web && node e2e/looks-org.mjs http://127.0.0.1:8446 "$RUNNER_TEMP/looks-org")
          # The chain is checked with the server stopped: the database is the service's while it runs.
          kill "$ORG"; wait "$ORG" || true
          ./target/release/localspace audit verify --data "$RUNNER_TEMP/orgdata"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: looks-org-screenshots
          path: ${{ runner.temp }}/looks-org
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: serve-logs
          path: |
            ${{ runner.temp }}/serve.log
            ${{ runner.temp }}/org-serve.log
            ${{ runner.temp }}/maths-serve.log
            ${{ runner.temp }}/pictures-serve.log
            ${{ runner.temp }}/full-serve.log

  measure:
    # The measurement kit, run against the test engine: it judges nothing
    # there, but every message must be answered, Continue must carry through,
    # and the results file must hold the thinking pass, the picture both ways
    # and the engine's reading, which would have caught 1.6 and 1.7 breaking
    # the way answers arrive without a test failing (docs/DECISIONS.md,
    # 2026-09-24 and 2026-10-08).
    name: the measurement kit against the test engine (every message answered, Continue carried through)
    # Not on every push (docs/DECISIONS.md, 2026-10-15): on pull requests,
    # on merges to main and when run by hand.
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    needs: rust
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
          cache-on-failure: true
      - name: the server and the test engine
        run: cargo build --release -p localspace-cli -p localspace-core --bin localspace --bin fake_llama_server
      - name: every message answered, Continue carried through, the results file whole
        run: scripts/measure-fake.sh target/release/localspace target/release/fake_llama_server "$RUNNER_TEMP/measure"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: measure
          path: |
            ${{ runner.temp }}/measure/*.log
            ${{ runner.temp }}/measure/out/*.md

  w32-gate:
    name: the canvas gate on W32, from its recorded measurement
    if: github.event_name == 'workflow_dispatch' && inputs.w32_gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/w32-canvas-gate.mjs docs/gates/w32-canvas.json | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash
