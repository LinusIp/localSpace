[workspace]
resolver = "2"
members = [
    "crates/localspace-proto",
    "crates/localspace-core",
    "crates/localspace-client",
    "crates/localspace-desktop",
    "crates/localspace-server",
    "crates/localspace-cli",
    "crates/localspace-shell",
    "crates/localspace-surface-sdk",
    "crates/localspace-harness-sdk",
]
exclude = ["harnesses"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
# --- contract / serialization ---
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
postcard = { version = "1.1", features = ["alloc"] }
toml = "0.9"
schemars = { version = "1", features = ["derive"] }
ts-rs = { version = "12", features = ["serde-compat", "no-serde-warnings", "serde-json-impl"] }

# --- errors / logging ---
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- async ---
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "process", "fs"] }
futures = "0.3"
async-trait = "0.1"

# --- gui (pinned: part of harness-api) ---
egui = { version = "0.36", default-features = false, features = ["serde"] }
epaint = { version = "0.36", default-features = false, features = ["serde"] }
eframe = { version = "0.36", default-features = false }
egui_tiles = "0.17"

# --- state ---
automerge = "0.11"
blake3 = "1.8"
# Approved on 2026-09-19: a download is held to the SHA-256 its publisher
# gives, and a file that arrived by other means is recognised by it.
sha2 = "0.10"
redb = "4"

# --- runtime ---
wasmtime = "48"
wasmtime-wasi = "48"

# --- server ---
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }

# --- misc ---
uuid = { version = "1", features = ["v4", "serde"] }
# The one binary's command line (Phase A, answer 1: the derive API).
clap = { version = "4", features = ["derive"] }
# Password hashing for local accounts (Pilot 1, Phase A, answer 3): argon2id.
argon2 = { version = "0.5", features = ["std"] }
time = { version = "0.3", features = ["formatting", "parsing", "serde", "macros"] }
ureq = { version = "3", features = ["json"] }

# Debug builds keep the workspace crates unoptimised for debugging, but the
# dependencies — Cranelift, wgpu, egui — are built optimised. Without this a
# `cargo run` JIT-compiles wasm with an unoptimised compiler, which is the
# difference between a two-second and a twenty-second startup.
# Line tables keep `panicked at file:line` and backtraces readable and cut the
# debug build from 59 GB to 11 GB, and the linkers' memory with it; CI sets the
# same (docs/DECISIONS.md, 2026-09-14). For a session that needs a debugger's
# variables, `CARGO_PROFILE_DEV_DEBUG=full` for that build.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

# CLAUDE.md, "Coding standards": no `unwrap()` outside tests. A warning
# across the existing crates while they migrate module by module; every new
# crate denies it (docs/DECISIONS.md, 2026-09-10).
[workspace.lints.clippy]
unwrap_used = "warn"
