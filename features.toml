# Which switched features a build has on, by its channel
# (docs/decisions/2026-10-31-switched-features.md). Core reads this file when it is compiled; the channel comes
# from LOCALSPACE_CHANNEL at build time, and a build that names none is
# "stable". An installation can turn a switch itself afterwards.
#
# A channel turns a feature on only by the founder's decision, one file each
# in docs/decisions/. A name here must be a feature Core knows
# (`features::ALL`).

[channels]
dev = []
preview = ["themes", "lfm3"]
stable = []
