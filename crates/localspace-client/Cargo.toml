[package]
name = "localspace-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "localSpace GUI. No IO except through `Backend`. Compiles to native and wasm32."

[dependencies]
localspace-proto = { path = "../localspace-proto" }
localspace-surface-sdk = { path = "../localspace-surface-sdk" }
serde.workspace = true
serde_json.workspace = true
postcard.workspace = true
anyhow.workspace = true
tracing.workspace = true
egui = { workspace = true, default-features = true }
epaint = { workspace = true, default-features = true, features = ["serde"] }
eframe = { workspace = true, default-features = true, features = ["wgpu"] }
egui_tiles.workspace = true
async-trait.workspace = true
futures.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wasmtime.workspace = true
tokio.workspace = true

[lints]
workspace = true
