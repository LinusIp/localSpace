[package]
name = "localspace-shell"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true
description = "The localSpace desktop app: Core and the API in this process, the web client in the system webview (Tauri 2)."

[[bin]]
name = "localspace-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
localspace-core = { path = "../localspace-core" }
localspace-server = { path = "../localspace-server" }
tauri = { version = "2", features = [] }
# Approved on 2026-09-12 (docs/DECISIONS.md, the desktop answers): a failure
# the person can see, and one running copy.
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tokio ={ workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# No `[lints] workspace = true` here on purpose: it would recompile the Tauri
# build script, and on the review machine every freshly built executable is a
# coin toss with application control. The same lint is set in main.rs.
