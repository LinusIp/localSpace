[package]
name = "localspace-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "localspace serve: Core, the HTTP and WebSocket API, and the web client bundle. Also the library the desktop shell embeds."

[dependencies]
localspace-proto = { path = "../localspace-proto" }
localspace-core = { path = "../localspace-core" }
anyhow.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
axum.workspace = true
tower-http.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
thiserror.workspace = true
blake3.workspace = true
schemars.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio-tungstenite = "0.28"
tempfile = "3"

[lints]
workspace = true
