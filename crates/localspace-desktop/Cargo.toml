[package]
name = "localspace-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The egui desktop client with Core in one process, until it is archived; the localspace binary is the cli crate."

[[bin]]
name = "localspace-desktop"
path = "src/main.rs"

[dependencies]
localspace-proto = { path = "../localspace-proto" }
localspace-core = { path = "../localspace-core" }
localspace-client = { path = "../localspace-client" }
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
eframe = { workspace = true, default-features = true, features = ["wgpu"] }
egui = { workspace = true, default-features = true }
async-trait.workspace = true
futures.workspace = true
serde_json.workspace = true

[lints]
workspace = true
