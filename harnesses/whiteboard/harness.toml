[harness]
id = "io.localspace.whiteboard"
version = "1.2.0"
api = "^1.0"
title = "Whiteboard"
publisher = "localSpace"
tier = "wasm"

[capabilities]
fs = "none"
net = "none"
gpu = false
clipboard = "on-user-action"
docs = "none"
model = []

[resources]
memory_mb = { logic = 32, surface = 32 }   # surface: the frame; not enforced until a browser reports its memory (architecture §6.6)
idle_unload = "5m"

[contributes]
views = [
  { id = "web", kind = "web", module = "ui/web/index.js", placement = "main", title = "Board" },
  { id = "settings", kind = "widgets", placement = "side", title = "Board settings" },
]
tools = "tools.json"
context_provider = true
produces = ["outline.v1", "image.v1", "svg.v1"]
doc = "crdt"
file_types = [".lsboard"]
logic = "logic.wasm"

[model_hints]
prefers = ["tool-use", "ctx>=16k"]

[dependencies]
"io.localspace.types" = "^1.0"   # declares outline.v1, image.v1 and svg.v1 (plugin spec §18.3)
