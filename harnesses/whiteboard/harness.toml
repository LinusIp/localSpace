[harness]
id = "io.localspace.whiteboard"
version = "1.0.0"
api = "^1.0"
title = "Whiteboard"
publisher = "localSpace"
tier = "wasm"

[capabilities]
fs = "none"
net = "none"
gpu = false
clipboard = "on-user-action"
docs = "none"
model = []

[resources]
memory_mb = { logic = 32, surface = 32 }   # the surface peaks near 18 MB zooming a text-heavy board; see tests/surface.rs
idle_unload = "5m"

[contributes]
views = [
  { id = "web", kind = "web", module = "ui/web/index.js", placement = "main", title = "Board" },
  { id = "board", kind = "egui", module = "ui/board.wasm", placement = "main", title = "Board (egui)" },
  { id = "settings", kind = "widgets", placement = "side", title = "Board settings" },
]
tools = "tools.json"
context_provider = true
produces = ["outline.v1"]
doc = "crdt"
file_types = [".lsboard"]
logic = "logic.wasm"

[model_hints]
prefers = ["tool-use", "ctx>=16k"]
